<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Shop - Factory Pattern (Functions)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      text-align: center;
      padding: 40px;
    }
    h1 {
      color: #6b4226;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #8b5e3c;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #6b4226;
    }
    #orders {
      margin-top: 30px;
      padding: 20px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: inline-block;
      text-align: left;
    }
    .order-item {
      margin: 10px 0;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>☕ Coffee Shop </h1>
  <div id="coffee-selection-container">
    <h2>Select your coffee:</h2>
  
  <button onclick="orderCoffee('espresso')">Espresso</button>
  <button onclick="orderCoffee('latte')">Latte</button>
  <button onclick="orderCoffee('cappuccino')">Cappuccino</button>
  </div>
  
  <div id="orders">
    <h2>Your Orders:</h2>
    <div id="order-list"></div>
  </div>

  <script src="coffee-factory.js">   
  </script>
</body>
</html>
